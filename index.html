<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谷盒 GrainBox · 手办/谷子收藏管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #3FC79A;        /* 主色：薄荷绿（取自参考图） */
    --green-d: #23A87F;
    --green-l: #EAF9F3;
    --bg: #F4F8F6;
    --card: #FFFFFF;
    --border: #E6EEE9;
    --text: #17221D;
    --text2: #7A8A82;
    --primary: #23A87F;      /* 兼容旧变量名，值同步为绿 */
    --primary2: #3FC79A;
    --owned: #16A34A;
    --preorder: #2563EB;
    --wishlist: #D97706;
    --sold: #6B7280;
    --danger: #E5484D;
    --radius: 16px;
    --shadow: 0 4px 18px rgba(23,70,52,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ---------- 顶栏：发现 / 广场 两个大导航 ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .hd-in {
    max-width: 760px; margin: 0 auto; padding: 0 16px;
    height: 54px; display: flex; align-items: center;
  }
  .logo {
    font-size: 15px; font-weight: 800; color: var(--green-d);
    letter-spacing: .3px; display: flex; align-items: center; gap: 6px;
  }
  .logo i {
    width: 22px; height: 22px; border-radius: 7px; display: inline-block;
    background: linear-gradient(135deg, var(--green), #8BE3C4);
    position: relative; flex-shrink: 0;
  }
  .logo i::after {
    content: ""; position: absolute; left: 5px; right: 5px; top: 10px;
    height: 2px; background: #fff; border-radius: 2px;
  }
  .big-nav { flex: 1; display: flex; justify-content: center; gap: 30px; }
  .big-nav a {
    position: relative; font-size: 18px; font-weight: 700; color: #9AA8A0;
    padding: 4px 0 12px;
  }
  .big-nav a.active { color: var(--text); font-size: 19px; }
  .big-nav a.active::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 4px; width: 18px; height: 3px; border-radius: 3px; background: var(--green);
  }
  .hd-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .hd-avatar {
    width: 30px; height: 30px; border-radius: 50%; overflow: hidden;
    background: var(--green-l); color: var(--green-d);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .hd-avatar img { width: 100%; height: 100%; object-fit: cover; }

  main { max-width: 760px; margin: 0 auto; padding: 14px 16px 96px; }

  /* ---------- 通用按钮 ---------- */
  .btn {
    border-radius: 10px; padding: 9px 18px; font-size: 14px;
    background: var(--green); color: #fff; font-weight: 700; transition: .15s;
  }
  .btn:hover { background: var(--green-d); }
  .btn.light { background: #fff; color: var(--green-d); border: 1px solid var(--border); }
  .btn.light:hover { background: var(--green-l); }
  .btn.small { padding: 6px 13px; font-size: 13px; border-radius: 8px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn.ghost { background: var(--green-l); color: var(--green-d); }

  /* ---------- 搜索 ---------- */
  .search-wrap {
    background: #F0F3F1; border-radius: 22px; height: 42px;
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
    margin-bottom: 14px;
  }
  .search-wrap svg { flex-shrink: 0; opacity: .45; }
  .search-wrap input {
    flex: 1; border: none; outline: none; background: none;
    font-size: 14px; color: var(--text); font-family: inherit;
  }
  .search-wrap input::placeholder { color: #A7B4AD; }
  .search-wrap .clr { font-size: 16px; color: #A7B4AD; padding: 0 2px; }

  /* ---------- IP 文字导航（纯文字，横向滚动） ---------- */
  .ip-row {
    display: flex; gap: 22px; margin-bottom: 14px;
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 0 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .ip-row::-webkit-scrollbar { display: none; }
  .ip {
    flex-shrink: 0; font-size: 14px; color: var(--text2);
    white-space: nowrap; cursor: pointer; padding: 3px 1px;
    position: relative; transition: color .15s;
  }
  .ip:hover { color: var(--text); }
  .ip.on { color: var(--green-d); font-weight: 800; }
  .ip.on::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -2px; width: 16px; height: 2.5px; border-radius: 2px; background: var(--green);
  }

  /* ---------- 页签 / chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    padding: 6px 15px; border-radius: 20px; font-size: 13px; cursor: pointer;
    background: #fff; border: 1px solid var(--border); color: var(--text2);
  }
  .chip:hover { border-color: var(--green); color: var(--green-d); }
  .chip.active { background: var(--green); color: #fff; border-color: transparent; font-weight: 700; }

  /* ---------- 横幅 ---------- */
  .promo {
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
    background: linear-gradient(120deg, #FFF1DC, #FFE3CE 55%, #FFD9C2);
    display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden;
  }
  .promo::after {
    content: ""; position: absolute; right: -30px; top: -30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,.35);
  }
  .promo-txt { flex: 1; position: relative; z-index: 1; }
  .promo-txt b { display: block; font-size: 17px; color: #B4460F; margin-bottom: 5px; }
  .promo-txt p { font-size: 12.5px; color: #A96A45; line-height: 1.6; }
  .promo-emoji { font-size: 42px; position: relative; z-index: 1; }

  /* ---------- 卡片网格 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
  .card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; transition: .18s; display: flex; flex-direction: column;
    box-shadow: var(--shadow);
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(23,70,52,.12); }
  .card.clickable { cursor: pointer; }
  .cover {
    height: 148px; background: linear-gradient(135deg, #EAF9F3, #D7F2E7);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; color: var(--green-d); overflow: hidden;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .card-title {
    font-size: 13.5px; font-weight: 700; line-height: 1.4; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { font-size: 11.5px; color: var(--text2); }
  .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 6px; }

  /* ---------- 徽章 ---------- */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
  .badge.owned    { background: rgba(22,163,74,.12);  color: var(--owned); }
  .badge.preorder { background: rgba(37,99,235,.12);  color: var(--preorder); }
  .badge.wishlist { background: rgba(217,119,6,.12);  color: var(--wishlist); }
  .badge.sold     { background: rgba(107,114,128,.14); color: var(--sold); }
  .badge.cat      { background: var(--green-l); color: var(--green-d); }
  .badge.edition  { background: #F1F5F2; color: #5C6B63; }

  /* ---------- 区块标题 ---------- */
  .sec-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 20px 0 12px;
  }
  .sec-head h3 { font-size: 15.5px; font-weight: 800; }
  .sec-head a { font-size: 12.5px; color: var(--text2); }
  .sub { color: var(--text2); font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
  h2 { font-size: 20px; margin-bottom: 5px; font-weight: 800; }

  .banner {
    background: #FFF7E8; border: 1px solid #FFDFA8; color: #A8620C;
    border-radius: 12px; padding: 12px 15px; font-size: 13.5px; margin-bottom: 14px;
  }

  /* ---------- 统计看板 ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px 12px; box-shadow: var(--shadow); }
  .stat .num { font-size: 23px; font-weight: 800; color: var(--green-d); font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 11.5px; color: var(--text2); margin-top: 3px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
  .bar-label { width: 110px; color: var(--text2); text-align: right; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: #EDF3EF; border-radius: 6px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #8BE3C4); border-radius: 6px; min-width: 3px; transition: width .4s; }
  .bar-num { width: 34px; font-weight: 700; }
  h3.sec { font-size: 15px; margin: 18px 0 10px; font-weight: 800; }

  /* ---------- 列表 ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row-item {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .row-item .thumb {
    width: 52px; height: 52px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(135deg, #EAF9F3, #D7F2E7);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--green-d); font-size: 20px; overflow: hidden;
  }
  .row-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12px; color: var(--text2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

  /* ---------- 瀑布流帖子（广场） ---------- */
  .feed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  @media (max-width: 560px) { .feed { gap: 8px; } }
  .post { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
  .post-img {
    aspect-ratio: 3/4; background: linear-gradient(135deg, #EAF9F3, #D7F2E7);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: var(--green-d); overflow: hidden;
  }
  .post-img img { width: 100%; height: 100%; object-fit: cover; }
  .post-body { padding: 9px 11px 11px; }
  .post-title {
    font-size: 13px; font-weight: 700; line-height: 1.45; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .post-foot { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .post-av {
    width: 17px; height: 17px; border-radius: 50%; background: var(--green-l);
    color: var(--green-d); font-size: 9px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .post-tag {
    display: inline-block; margin-bottom: 6px; font-size: 11px; color: var(--green-d);
    background: var(--green-l); padding: 2px 8px; border-radius: 6px;
  }

  /* ---------- 表单 ---------- */
  .form { display: flex; flex-direction: column; gap: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--text2); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 14px;
    background: #fff; border: 1px solid var(--border); color: var(--text);
    font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); }
  .field .req::after { content: " *"; color: var(--danger); }
  .form-row { display: flex; gap: 10px; }
  .form-row .field { flex: 1; }
  .admin-panel { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .admin-panel h3 { margin-bottom: 14px; font-size: 15px; font-weight: 800; }
  .stars { display: flex; gap: 4px; }
  .stars .star { font-size: 21px; color: #D8E2DB; cursor: pointer; }
  .stars .star.on { color: #F5A524; }

  /* ---------- 详情页 ---------- */
  .detail { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 700px) { .detail { grid-template-columns: 1fr; } }
  .detail-cover { border-radius: var(--radius); overflow: hidden; background: #fff; box-shadow: var(--shadow); }
  .detail-cover img, .detail-cover .ph {
    width: 100%; height: 300px; object-fit: cover; display: flex;
    align-items: center; justify-content: center; font-size: 60px;
    color: var(--green-d); background: linear-gradient(135deg,#EAF9F3,#D7F2E7);
  }
  .detail-info { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .detail-info h2 { margin-bottom: 8px; }
  .kv { display: flex; font-size: 13.5px; margin: 7px 0; }
  .kv .k { width: 76px; color: var(--text2); flex-shrink: 0; }
  .detail-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .detail-imgs img { width: 78px; height: 78px; object-fit: cover; border-radius: 9px; }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,35,26,.46); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: #fff; border-radius: 18px; width: 100%; max-width: 420px; padding: 22px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { margin-bottom: 16px; font-size: 17px; font-weight: 800; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  /* ---------- 登录 / 注册 / 重置密码 ---------- */
  .auth-tip {
    background: var(--green-l); border-radius: 10px; padding: 9px 12px;
    font-size: 11.8px; line-height: 1.7; color: #2C6B55;
  }
  .auth-tip b { color: var(--green-d); }
  .auth-links {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; color: var(--text2); gap: 8px;
  }
  .auth-links a { color: var(--green-d); font-weight: 700; cursor: pointer; }
  .auth-links a:hover { text-decoration: underline; }
  .code-row { display: flex; gap: 8px; align-items: stretch; }
  .code-row input {
    flex: 1; min-width: 0; text-align: center;
    letter-spacing: 7px; font-size: 17px; font-weight: 700;
    font-variant-numeric: tabular-nums; padding-left: 18px;
  }
  .code-row .btn { flex-shrink: 0; white-space: nowrap; padding: 0 12px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--green); }
  .btn.light:disabled:hover { background: #fff; }

  /* ---------- 底部 tabbar ---------- */
  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 760px; z-index: 60;
    background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10.5px; color: #9BA9A1; padding: 4px 0; position: relative;
  }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a.active { color: var(--green-d); font-weight: 700; }
  .tabbar a.active svg { stroke: var(--green-d); }
  .tabbar .dot {
    position: absolute; top: 2px; right: 22%;
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
    background: #FF5A5F; color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  #toast {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .toast-msg {
    background: #1D3128; color: #fff; padding: 9px 20px; border-radius: 10px;
    font-size: 13.5px; animation: fadein .2s; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .toast-msg.err { background: var(--danger); }
  @keyframes fadein { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; } }

  /* ---------- 我的谷库：图片墙 ---------- */
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
  .shot {
    background: var(--card); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow); cursor: pointer; transition: transform .15s;
  }
  .shot:hover { transform: translateY(-2px); }
  .shot-img {
    aspect-ratio: 1/1; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #EAF9F3, #D7F2E7);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: var(--green-d);
  }
  .shot-img img { width: 100%; height: 100%; object-fit: cover; }
  .shot-img .own {
    position: absolute; left: 6px; top: 6px; padding: 2px 6px; border-radius: 6px;
    background: rgba(35,168,127,.92); color: #fff; font-size: 9.5px; font-weight: 700;
    letter-spacing: .3px;
  }
  .shot-body { padding: 8px 10px 10px; }
  .shot-name {
    font-size: 12.5px; font-weight: 700; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .shot-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px; font-size: 11px; color: var(--text2);
  }
  .shot-foot .n { font-variant-numeric: tabular-nums; }

  /* ---------- 相册管理弹窗 ---------- */
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .shots .ph {
    position: relative; aspect-ratio: 1/1; border-radius: 10px;
    overflow: hidden; background: #EDF3EF;
  }
  .shots .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shots .ph .x {
    position: absolute; right: 3px; top: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .shots .ph .cv {
    position: absolute; left: 3px; bottom: 3px; padding: 1px 6px; border-radius: 5px;
    background: rgba(35,168,127,.94); color: #fff; font-size: 9.5px; font-weight: 700;
  }
  .shots .ph .cv.off { background: rgba(0,0,0,.5); font-weight: 400; cursor: pointer; }
  .shots .add {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: 1.5px dashed var(--border); color: var(--text2);
    font-size: 10.5px; cursor: pointer; background: #FAFCFB;
  }
  .shots .add b { font-size: 20px; font-weight: 400; line-height: 1; color: var(--green-d); }

  .empty { text-align: center; color: var(--text2); padding: 50px 0; font-size: 13.5px; }
  .empty a { color: var(--green-d); font-weight: 700; }
  .login-tip { text-align: center; padding: 50px 0; color: var(--text2); font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="hd-in">
    <span class="logo"><i></i>谷盒</span>
    <nav class="big-nav" id="nav"></nav>
    <div class="hd-right" id="userBox"></div>
  </div>
</header>

<main id="app"></main>
<nav class="tabbar" id="tabbar"></nav>
<div id="toast"></div>
<div id="modal-root"></div>

<script>

/* ============================================================

/* ============================================================
 * 登录 / 注册 / 忘记密码
 *   注册：邮箱 + 密码 + 6 位邮箱验证码（verifyOtp type=signup）
 *   找回：邮箱 → 验证码（type=recovery）→ 新密码
 *   未验证邮箱的老账号：登录被拒时自动转「输验证码补验证」
 * 密码明文只在浏览器内存里过一下，直接交给 Supabase Auth；
 * 服务端用 bcrypt 单向哈希存进 auth.users.encrypted_password，
 * 本站任何业务表都不存密码，也不存哈希。
 * ============================================================ */
let authTimer = null;   // 「重新发送」倒计时
let authEmail = "";     // 跨步骤传递的邮箱

function authValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
function authValidPass(v) { return v.length >= 8 && /[a-zA-Z]/.test(v) && /\d/.test(v); }
function authTips(html) { return '<div class="auth-tip">' + html + "</div>"; }

function startCooldown(btnId, sec, label) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  let left = sec;
  btn.disabled = true;
  const paint = () => {
    if (left > 0) {
      btn.textContent = left + "s 后重发";
      left--;
    } else {
      if (authTimer) { clearInterval(authTimer); authTimer = null; }
      btn.disabled = false;
      btn.textContent = label;
    }
  };
  paint();
  authTimer = setInterval(paint, 1000);
}

// 登录审计：写进 login_logs（只有 security definer 函数能写，客户端无写权限）
async function logLogin(event) {
  try {
    await db.rpc("fn_log_login", {
      p_event: event,
      p_ua: (navigator.userAgent || "").slice(0, 180),
    });
  } catch (e) { /* 审计失败不影响登录 */ }
}

async function afterLogin(msg) {
  closeModal();
  toast(msg || "登录成功");
  await loadMe(); renderNav(); renderUserBox(); route();
}

function showAuthModal(view) {
  if (authTimer) { clearInterval(authTimer); authTimer = null; }
  if (view === "signup")  return showSignupModal();
  if (view === "verify")  return showVerifyModal();
  if (view === "reset")   return showResetModal();
  if (view === "newpass") return showNewPassModal();
  return showLoginModal();
}

/* ---------------- 登录 ---------------- */
function showLoginModal() {
  openModal(`<h3>登录</h3>
    <div class="form">
      <div class="field"><label>邮箱</label>
        <input id="aEmail" type="email" autocomplete="username" placeholder="you@example.com" value="${esc(authEmail)}"></div>
      <div class="field"><label>密码</label>
        <input id="aPass" type="password" autocomplete="current-password" placeholder="********"></div>
      <button class="btn" id="aGo">登录</button>
      <div class="auth-links">
        <a href="javascript:void(0)" id="aForgot">忘记密码？</a>
        <span>还没有账号？<a href="javascript:void(0)" id="aSignup">去注册</a></span>
      </div>
    </div>`);

  document.getElementById("aSignup").onclick = () => showAuthModal("signup");
  document.getElementById("aForgot").onclick = () => showAuthModal("reset");

  const go = async () => {
    const email = document.getElementById("aEmail").value.trim();
    const pass = document.getElementById("aPass").value;
    if (!authValidEmail(email)) return toast("邮箱格式不对", true);
    if (!pass) return toast("请输入密码", true);
    const btn = document.getElementById("aGo");
    btn.disabled = true; btn.textContent = "登录中…";
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    btn.disabled = false; btn.textContent = "登录";
    if (error) {
      const msg = error.message || "";
      // 邮箱还没验证时 Supabase 直接拒登：不甩给用户一句英文报错，转去补验证
      if (/not confirmed/i.test(msg)) {
        authEmail = email;
        await db.auth.resend({ type: "signup", email });
        toast("邮箱还没验证，已重新发送验证码");
        return showAuthModal("verify");
      }
      return toast("登录失败：" + msg, true);
    }
    authEmail = email;
    logLogin("login");
    await afterLogin("登录成功");
  };
  document.getElementById("aGo").onclick = go;
  document.getElementById("aPass").onkeydown = ev => { if (ev.key === "Enter") go(); };
}

/* ---------------- 注册（邮箱 + 密码 + 验证码） ---------------- */
function showSignupModal() {
  openModal(`<h3>注册账号</h3>
    ${authTips("先填邮箱和密码点「发送验证码」，收到 6 位数字后填进来完成注册。<br>密码由 Supabase Auth 以 bcrypt 单向哈希保存，本站不存明文。")}
    <div class="form" style="margin-top:12px">
      <div class="field"><label>邮箱</label>
        <input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(authEmail)}"></div>
      <div class="field"><label>密码（至少 8 位，含字母和数字）</label>
        <input id="aPass" type="password" autocomplete="new-password" placeholder="********"></div>
      <div class="field"><label>邮箱验证码</label>
        <div class="code-row">
          <input id="aCode" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code">
          <button class="btn light" id="aSend">发送验证码</button>
        </div>
      </div>
      <button class="btn" id="aGo">完成注册</button>
      <div class="auth-links"><span>已有账号？<a href="javascript:void(0)" id="aLogin">去登录</a></span></div>
    </div>`);

  document.getElementById("aLogin").onclick = () => showAuthModal("login");
  const read = () => ({
    email: document.getElementById("aEmail").value.trim(),
    pass: document.getElementById("aPass").value,
    code: document.getElementById("aCode").value.replace(/\D/g, ""),
  });

  document.getElementById("aSend").onclick = async () => {
    const { email, pass } = read();
    if (!authValidEmail(email)) return toast("先填一个正确的邮箱", true);
    if (!authValidPass(pass)) return toast("密码需至少 8 位且含字母和数字", true);
    const btn = document.getElementById("aSend");
    btn.disabled = true; btn.textContent = "发送中…";
    // 真正建账号并触发验证码邮件；同邮箱重复注册不报错（防枚举）
    const { data, error } = await db.auth.signUp({ email, password: pass });
    if (error) {
      btn.disabled = false; btn.textContent = "发送验证码";
      return toast("发送失败：" + error.message, true);
    }
    authEmail = email;
    // 项目若关掉了「邮箱确认」，signUp 会直接返回 session，那就不需要验证码
    if (data && data.session) {
      logLogin("login");
      return afterLogin("注册成功，已登录");
    }
    // identities 为空 = 这个邮箱早就注册过（Supabase 防枚举的标准返回）
    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      btn.disabled = false; btn.textContent = "发送验证码";
      toast("这个邮箱已经注册过了，请直接登录", true);
      return showAuthModal("login");
    }
    toast("验证码已发到邮箱，10 分钟内有效");
    startCooldown("aSend", 60, "重新发送");
  };

  document.getElementById("aGo").onclick = async () => {
    const { email, code } = read();
    if (!authValidEmail(email)) return toast("邮箱格式不对", true);
    if (code.length !== 6) return toast("验证码是 6 位数字", true);
    const btn = document.getElementById("aGo");
    btn.disabled = true; btn.textContent = "验证中…";
    const { error } = await db.auth.verifyOtp({ email, token: code, type: "signup" });
    btn.disabled = false; btn.textContent = "完成注册";
    if (error) return toast("验证失败：" + error.message, true);
    logLogin("login");
    await afterLogin("注册成功，已登录");
  };
}

  startCooldown("aSend", 30, "重新发送");

  document.getElementById("aSend").onclick = async () => {
    const btn = document.getElementById("aSend");
    btn.disabled = true;
    const { error } = await db.auth.resend({ type: "signup", email: authEmail });
    if (error) {
      btn.disabled = false;
      return toast("发送失败：" + error.message, true);
    }
    toast("验证码已重新发送");
    startCooldown("aSend", 60, "重新发送");
  };

  document.getElementById("aGo").onclick = async () => {
    const code = document.getElementById("aCode").value.replace(/\D/g, "");
    if (code.length !== 6) return toast("验证码是 6 位数字", true);
    const btn = document.getElementById("aGo");
    btn.disabled = true; btn.textContent = "验证中…";
    const { error } = await db.auth.verifyOtp({ email: authEmail, token: code, type: "signup" });
    btn.disabled = false; btn.textContent = "验证并登录";
    if (error) return toast("验证失败：" + error.message, true);
    logLogin("login");
    await afterLogin("邮箱已验证，登录成功");
  };
}

/* ---------------- 忘记密码：验证码 + 新密码 ---------------- */
function showResetModal() {
  openModal(`<h3>忘记密码</h3>
    ${authTips("填注册时用的邮箱，点「发送验证码」，收到 6 位数字后设置新密码。")}
    <div class="form" style="margin-top:12px">
      <div class="field"><label>邮箱</label>
        <input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(authEmail)}"></div>
      <div class="field"><label>邮箱验证码</label>
        <div class="code-row">
          <input id="aCode" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code">
          <button class="btn light" id="aSend">发送验证码</button>
        </div>
      </div>
      <div class="field"><label>新密码（至少 8 位，含字母和数字）</label>
        <input id="aPass" type="password" autocomplete="new-password" placeholder="********"></div>
      <button class="btn" id="aGo">重置密码</button>
      <div class="auth-links"><a href="javascript:void(0)" id="aBack">返回登录</a><span></span></div>
    </div>`);

  document.getElementById("aBack").onclick = () => showAuthModal("login");

  document.getElementById("aSend").onclick = async () => {
    const email = document.getElementById("aEmail").value.trim();
    if (!authValidEmail(email)) return toast("邮箱格式不对", true);
    const btn = document.getElementById("aSend");
    btn.disabled = true; btn.textContent = "发送中…";
    const { error } = await db.auth.resetPasswordForEmail(email);
    if (error) {
      btn.disabled = false; btn.textContent = "发送验证码";
      return toast("发送失败：" + error.message, true);
    }
    authEmail = email;
    toast("验证码已发到邮箱，10 分钟内有效");
    startCooldown("aSend", 60, "重新发送");
  };

  document.getElementById("aGo").onclick = async () => {
    const email = document.getElementById("aEmail").value.trim();
    const code = document.getElementById("aCode").value.replace(/\D/g, "");
    const pass = document.getElementById("aPass").value;
    if (!authValidEmail(email)) return toast("邮箱格式不对", true);
    if (code.length !== 6) return toast("验证码是 6 位数字", true);
    if (!authValidPass(pass)) return toast("密码需至少 8 位且含字母和数字", true);
    const btn = document.getElementById("aGo");
    btn.disabled = true; btn.textContent = "提交中…";
    const v = await db.auth.verifyOtp({ email, token: code, type: "recovery" });
    if (v.error) {
      btn.disabled = false; btn.textContent = "重置密码";
      return toast("验证失败：" + v.error.message, true);
    }
    logLogin("reset");
    const u = await db.auth.updateUser({ password: pass });
    btn.disabled = false; btn.textContent = "重置密码";
    if (u.error) return toast("重置失败：" + u.error.message, true);
    await db.auth.signOut();
    await loadMe(); renderNav(); renderUserBox(); route();
    closeModal();
    toast("密码已重置，请用新密码登录");
    showAuthModal("login");
  };
}

  openModal(`<h3>设置新密码</h3>
    ${authTips("邮箱验证已通过，输入新密码即可完成重置。")}
    <div class="form" style="margin-top:12px">

    const p2 = document.getElementById("aPass2").value;

function openModal(html) {
  document.getElementById("modal-root").innerHTML =
    '<div class="modal-mask" id="mask"><div class="modal">' + html + "</div></div>";
  document.getElementById("mask").onclick = e => { if (e.target.id === "mask") closeModal(); };
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

/* ---------------- 数据加载 ---------------- */
async function loadMe() {
  const { data: { session } } = await db.auth.getSession();
  me = session ? session.user : null;
  myProfile = null;
  if (me) {
    const { data } = await db.from("profiles").select("*").eq("id", me.id).single();
    myProfile = data;
  }
}

/* ---------------- 路由 ---------------- */
function route() {
  renderNav();
  const h = location.hash || "#/";
  const parts = h.replace(/^#\/?/, "").split("/");
  const page = parts[0] || "home";
  const param = parts[1] ? decodeURIComponent(parts[1]) : "";
  window.scrollTo(0, 0);
  // 直接进发现页时清空筛选状态，避免上次筛的 IP/分类残留
  if (page === "home" && !param) { ipFilter = ""; catFilter = ""; kwFilter = ""; }

  if (!KEY_OK) return $app.innerHTML = '<div class="banner">⚠️ 尚未配置 Supabase anon key：编辑本文件顶部 SUPABASE_ANON_KEY 的值，刷新即可。</div>';
  // 旧的「我的收藏」地址统一并到谷库，避免老链接 404
  if (page === "collections") return location.hash = "#/library";
  if ((page === "dashboard" || page === "profile") && !me) return location.hash = "#/";
  if (page === "admin" && (!me || !myProfile || !myProfile.is_admin)) return $app.innerHTML = '<div class="empty">只有管理员能访问此页</div>';

  if (page === "home")    return pageHome();
  if (page === "series")  return pageSeries(param);
  if (page === "item")    return pageItem(param);
  if (page === "plaza")   return pagePlaza();
  if (page === "search")  return pageSearch(param);
  if (page === "library") return pageLibrary();
  if (page === "dashboard")   return pageDashboard();
  if (page === "profile")     return pageProfile();
  if (page === "admin")       return pageAdmin();
  return pageHome();
}

/* ============================================================
 * 发现页（首页）：搜索 + IP 图标导航 + 分类 chips + 藏品流
 * ============================================================ */
let ipFilter = "";       // 当前选中的 IP slug，"all" 表示推荐
let catFilter = "";      // 当前分类
let kwFilter = "";       // 搜索关键词

async function pageHome() {
  const { data: series, error } = await db.from("v_series_stats").select("*").order("name");
  if (error) return $app.innerHTML = '<div class="empty">加载失败：' + esc(error.message) + "</div>";
  const list = series || [];

  $app.innerHTML = `
    <div class="search-wrap">
      ${icon.search}
      <input id="q" placeholder="搜索藏品、系列、IP…" value="${esc(kwFilter)}" autocomplete="off">
      ${kwFilter ? '<span class="clr" id="qclr">✕</span>' : ""}
    </div>

    <div class="ip-row" id="ipRow">${ipRowHtml(list)}</div>

    <div class="chips" id="catRow">
      <span class="chip ${catFilter === "" ? "active" : ""}" data-cat="">全部</span>
      ${CATEGORY_ORDER.map(c => '<span class="chip ' + (catFilter === c ? "active" : "") + '" data-cat="' + c + '">' + CATEGORY[c] + "</span>").join("")}
    </div>

    ${ipFilter === "" && !catFilter && !kwFilter ? `
      <div class="promo">
        <div class="promo-txt">
          <b>@晒谷大会 · 开盒晒图有奖</b>
          <p>公开你的收藏到广场，就有机会登上本周热榜<br>发现 → 收藏 → 晒出，三步搞定</p>
        </div>
        <div class="promo-emoji">🎁</div>
      </div>` : ""}

    <div class="sec-head">
      <h3 id="listTitle">${listTitle(list)}</h3>
      <span class="card-meta" id="listCount"></span>
    </div>
    <div class="grid" id="itemGrid"><div class="empty">加载中…</div></div>`;

  bindHomeEvents(list);
  await loadItems(list);
}

function ipChip(s) {
  const on = ipFilter === s.slug ? "on" : "";
  // 纯文字导航：名字过长截到 6 字（完整名放 title，hover 可见）
  const label = s.name.length > 6 ? s.name.slice(0, 6) + "…" : s.name;
  return '<div class="ip ' + on + '" data-ip="' + esc(s.slug) + '" title="' + esc(s.name) + '">' +
    esc(label) + "</div>";
}

function ipRowHtml(list) {
  const rec = '<div class="ip ' + (ipFilter === "" ? "on" : "") + '" data-ip="">推荐</div>';
  return rec + list.map(ipChip).join("");
}

function listTitle(list) {
  if (kwFilter) return "搜索「" + kwFilter + "」";
  if (catFilter) return CATEGORY[catFilter];
  if (ipFilter) {
    const s = list.find(x => x.slug === ipFilter);
    return s ? s.name : "藏品";
  }
  return "推荐藏品";
}

async function loadItems(list) {
  const grid = document.getElementById("itemGrid");
  if (!grid) return;
  let q = db.from("items").select("*, series(name, slug)");
  if (ipFilter) {
    const s = list.find(x => x.slug === ipFilter);
    if (s) q = q.eq("series_id", s.series_id || s.id);
  }
  if (catFilter) q = q.eq("category", catFilter);
  if (kwFilter) q = q.ilike("name", "%" + kwFilter + "%");
  const { data: items, error } = await q.order("name").limit(60);
  if (error) { grid.innerHTML = '<div class="empty">加载失败：' + esc(error.message) + "</div>"; return; }
  const arr = items || [];
  const cnt = document.getElementById("listCount");
  if (cnt) cnt.textContent = arr.length + " 件";

  if (arr.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">没有匹配的藏品<br>换个关键词或 IP 试试</div>';
    return;
  }
  grid.innerHTML = arr.map(it => `
    <div class="card clickable" data-id="${it.id}">
      ${coverBlock(it, "cover", null, coverSrcOf(it))}
      <div class="card-body">
        <div class="card-title">${esc(it.name)}</div>
        <div class="card-meta">${esc(it.series ? it.series.name : "")}</div>
        <div class="card-meta">
          <span class="badge cat">${CATEGORY[it.category]}</span>
        </div>
      </div>
    </div>`).join("");
  grid.querySelectorAll(".card[data-id]").forEach(c => c.onclick = () => { location.hash = "#/item/" + c.dataset.id; });
}

function bindHomeEvents(list) {
  const q = document.getElementById("q");
  let timer;
  q.oninput = ev => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      kwFilter = ev.target.value.trim();
      location.hash = kwFilter ? "#/search/" + encodeURIComponent(kwFilter) : "#/";
    }, 380);
  };
  q.onkeydown = ev => {
    if (ev.key === "Enter") {
      kwFilter = q.value.trim();
      ipFilter = ""; catFilter = "";
      location.hash = kwFilter ? "#/search/" + encodeURIComponent(kwFilter) : "#/";
      pageHome();
    }
  };
  const clr = document.getElementById("qclr");
  if (clr) clr.onclick = () => { kwFilter = ""; location.hash = "#/"; };

  document.querySelectorAll("#ipRow .ip").forEach(el => el.onclick = () => {
    ipFilter = el.dataset.ip;
    pageHome();
  });
  document.querySelectorAll("#catRow .chip").forEach(el => el.onclick = () => {
    catFilter = el.dataset.cat;
    pageHome();
  });
}

/* ---------------- 搜索结果页（FR-27） ---------------- */

/* ============================================================
 * 系列详情（FR-07）：按 category 分组
 * ============================================================ */
async function pageSeries(slug) {
  const { data: s } = await db.from("series").select("*").eq("slug", slug).single();
  if (!s) return $app.innerHTML = '<div class="empty">系列不存在</div>';
  const { data: items } = await db.from("items").select("*, series(name, slug)").eq("series_id", s.id).order("name");
  const groups = {};
  (items || []).forEach(it => { (groups[it.category] = groups[it.category] || []).push(it); });

  $app.innerHTML = `
    <div style="margin:6px 0 14px">
      <h2 style="margin:0">${esc(s.name)}</h2>
      <div class="card-meta">${esc(s.description || "")} · 共 ${(items || []).length} 件</div>
    </div>
    <div class="chips"><span class="chip" data-back="1">← 返回发现</span></div>
    ${CATEGORY_ORDER.filter(cc => groups[cc]).map(cc => `
      <h3 class="sec">${CATEGORY[cc]}（${groups[cc].length}）</h3>
      <div class="grid" style="margin-bottom:14px">
        ${groups[cc].map(it => `
          <div class="card clickable" data-id="${it.id}">
            ${coverBlock(it, "cover", null, coverSrcOf(it, s.slug))}
            <div class="card-body">
              <div class="card-title">${esc(it.name)}</div>
              <div class="card-meta">
                <span class="badge edition">${EDITION[it.edition]}</span>
              </div>
            </div>
          </div>`).join("")}
      </div>`).join("")}`;
  $app.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { location.hash = "#/"; });
  $app.querySelectorAll(".card[data-id]").forEach(cc => cc.onclick = () => { location.hash = "#/item/" + cc.dataset.id; });
}

/* ============================================================
 * 藏品详情（FR-08）+ 加入收藏（FR-11/FR-12）
 * ============================================================ */
async function pageItem(id) {
  const { data: it } = await db.from("items").select("*, series(name, slug)").eq("id", id).single();
  if (!it) return $app.innerHTML = '<div class="empty">藏品不存在</div>';

  const { count } = await db.from("collections").select("id", { count: "exact", head: true }).eq("item_id", id).eq("is_public", true);

      <div class="detail-cover">${(() => { const src = coverSrcOf(it); return src ? '<img src="' + esc(src) + '" alt="' + esc(it.name) + '">' : '<div class="ph">' + esc(it.name.slice(0, 1)) + "</div>"; })()}</div>
      <div class="detail-info">

        ${it.release_date ? '<div class="kv"><span class="k">发售日期</span>' + esc(fmtDate(it.release_date)) + "</div>" : ""}

              ? '<button class="btn ghost" id="act" style="width:100%">已入库 · 管理我的实拍图</button>'

  $app.querySelectorAll("[data-back]").forEach(b => b.onclick = () => history.length > 1 ? history.back() : (location.hash = "#/"));

    if (mine) return openShots(libRow(mine, it));
    showCollectModal(it, mine);
  };
}

      </div>
      <div class="field"><label>评分</label>
        <div class="stars" id="cStars">${[1,2,3,4,5].map(i => '<span class="star ' + ((e.rating || 0) >= i ? "on" : "") + '" data-v="' + i + '">★</span>').join("")}</div></div>
      <div class="field"><label>备注（≤500 字）</label><textarea id="cNote" rows="2" maxlength="500">${esc(e.note || "")}</textarea></div>
      <div class="field" style="display:flex;align-items:center;gap:8px">
        <input id="cPublic" type="checkbox" ${e.is_public !== false ? "checked" : ""} style="width:auto">
        <label for="cPublic" style="margin:0">公开到广场</label>
      </div>
      <button class="btn" id="cSave">${existing ? "保存修改" : "加入收藏"}</button>

  let rating = e.rating || 0;
  document.querySelectorAll("#cStars .star").forEach(st => st.onclick = () => {

let libFilter = "all", libKw = "", libNeedPatch = false;

// 把「视图行」和「联表行」统一成一种形状，页面只认这一种
function libRow(c, it) {
  it = it || {};
  const s = it.series || {};
  return {
    collection_id: c.collection_id || c.id,
    status: c.status,
    price: c.price,
    currency: c.currency,
    purchased_at: c.purchased_at,
    source: c.source,
    note: c.note,
    rating: c.rating,
    is_public: c.is_public,
    item_id: c.item_id || it.id,
    item_name: c.item_name || it.name,
    category: c.category || it.category,
    edition: c.edition || it.edition,
    cover_url: c.cover_url != null ? c.cover_url : it.cover_url,
    series_name: c.series_name || s.name,
    series_slug: c.series_slug || s.slug,
    photo_count: Number(c.photo_count) || 0,
    cover_photo: c.cover_photo || "",
  };
}

async function loadLibRows() {
  const v = await db.from("v_my_library").select("*").order("updated_at", { ascending: false });
  if (!v.error) {
    libNeedPatch = false;
    return (v.data || []).map(r => libRow(r));
  }
  // 视图还没建（补丁 SQL 没跑）：退回联表查询，功能降级但不白屏
  libNeedPatch = true;
  const q = await db.from("collections")
    .select("id, status, price, currency, purchased_at, source, note, rating, is_public, updated_at, items(id, name, category, edition, cover_url, series(name, slug))")
    .order("updated_at", { ascending: false });
  return (q.data || []).map(r => libRow(r, r.items));
}

function libCard(r) {
  const src = r.cover_photo || coverSrcOf({ cover_url: r.cover_url, category: r.category, series: { slug: r.series_slug } });
  return '<div class="shot" data-cid="' + esc(r.collection_id) + '">' +
    '<div class="shot-img">' +
      (src
        ? '<img src="' + esc(src) + '" alt="' + esc(r.item_name || "") + '" loading="lazy" onerror="this.remove()">'
        : esc((r.item_name || "?").slice(0, 1))) +
      (r.cover_photo ? '<span class="own">我的实拍</span>' : "") +
    "</div>" +
    '<div class="shot-body">' +
      '<div class="shot-name">' + esc(r.item_name || "?") + "</div>" +
      '<div class="shot-foot"><span>' + esc(r.series_name || "") + "</span>" +
      '<span class="n">' + (r.photo_count ? r.photo_count + " 张" : "未上传") + "</span></div>" +
    "</div></div>";
}

// Supabase 公开链接 → Storage 对象路径（删文件时要用）
function shotPath(url) {
  const k = "/object/public/my-shots/";
  const i = (url || "").indexOf(k);
  return i < 0 ? "" : decodeURIComponent(url.slice(i + k.length).split("?")[0]);
}

async function openShots(row) {

  });

    if (g) await setShotCover(row, g, reload);
  });

async function uploadShots(row, files, done) {
  if (!files.length) return;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (!/image\/(jpeg|png|webp)/.test(f.type)) { toast("跳过非图片：" + f.name, true); continue; }
    toast("上传中 " + (i + 1) + "/" + files.length + "…");
    let blob;
    try { blob = await compressImage(f, 1100, 320 * 1024); }
    catch (e) { toast("压缩失败：" + f.name, true); continue; }

    // 路径首段必须是 uid，Storage 策略按它隔离
    const path = me.id + "/" + row.collection_id + "/" +
      Date.now() + "-" + Math.random().toString(36).slice(2, 7) + ".webp";
    const up = await db.storage.from("my-shots").upload(path, blob, { contentType: "image/webp", upsert: false });
    if (up.error) { toast("上传失败：" + up.error.message, true); continue; }

    const pub = db.storage.from("my-shots").getPublicUrl(path);
    const ins = await db.from("collection_images").insert({
      collection_id: row.collection_id,
      user_id: me.id,
      storage_path: pub.data.publicUrl,
      alt: row.item_name || null,
      sort_order: ok,
    });
    if (ins.error) {
      // 入库失败就把文件删掉，不留孤儿对象
      await db.storage.from("my-shots").remove([path]);
      toast("入库失败：" + ins.error.message, true);
      continue;
    }
    ok++;
  }
  if (ok) toast("已上传 " + ok + " 张实拍图");
  if (done) done();
}

async function deleteShot(g, done) {
  if (!confirm("删除这张照片？")) return;
  const { error } = await db.from("collection_images").delete().eq("id", g.id);
  if (error) return toast("删除失败：" + error.message, true);
  const p = shotPath(g.storage_path);
  if (p) await db.storage.from("my-shots").remove([p]);
  toast("已删除");
  if (done) done();
}

async function setShotCover(row, g, done) {
  // 先全部置 false 再置 true，否则中间态撞上「一件只有一张封面」的唯一索引
  await db.from("collection_images").update({ is_cover: false }).eq("collection_id", row.collection_id);
  const { error } = await db.from("collection_images").update({ is_cover: true }).eq("id", g.id);
  if (error) return toast("设置失败：" + error.message, true);
  toast("已设为封面");
  if (done) done();
}

    const { error } = await db.from("profiles").update({ nickname: nick, bio }).eq("id", me.id);
    if (error) return toast("保存失败：" + error.message, true);
    myProfile = { ...myProfile, nickname: nick, bio };
    renderUserBox(); toast("已保存");
  };

  document.getElementById("fAvatar").onchange = async ev => {
    const file = ev.target.files[0];
    if (!file) return;
    if (!/image\/(jpeg|png|webp)/.test(file.type)) return toast("仅支持 jpg/png/webp", true);
    toast("压缩上传中…");
    const blob = await compressImage(file, 300, 150 * 1024);
    const path = me.id + "/avatar.webp";
    const { error } = await db.storage.from("avatars").upload(path, blob, { contentType: "image/webp", upsert: true });
    if (error) return toast("头像上传失败：" + error.message, true);
    const { data } = db.storage.from("avatars").getPublicUrl(path);
    const url = data.publicUrl.split("?")[0] + "?t=" + Date.now();
    await db.from("profiles").update({ avatar_url: url }).eq("id", me.id);
    myProfile = { ...myProfile, avatar_url: url };
    renderUserBox(); toast("头像已更新"); pageProfile();
  };
}

/* ---------------- 图片压缩（canvas） ---------------- */
function compressImage(file, maxW, maxBytes) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        let quality = 0.82;
        const step = () => canvas.toBlob(b => {
          if (!b) return reject(new Error("压缩失败"));
          if (b.size <= maxBytes || quality <= 0.3) return resolve(b);
          quality -= 0.12; step();
        }, "image/webp", quality);
        step();
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function pageAdmin() {
  if (!me || !myProfile || !myProfile.is_admin) return;
  const { data: series } = await db.from("series").select("*").order("name");
  const { data: tags } = await db.from("tags").select("*").order("name");

  const acc = await db.rpc("fn_list_accounts");
  const accounts = Array.isArray(acc.data) ? acc.data : [];
  const accErr = acc.error ? (acc.error.message || "未启用") : "";

  const recent = Array.isArray(rl.data) ? rl.data : [];

    <div class="sec-head" style="margin-top:6px"><h3>内容管理</h3></div>
    <div class="sub" style="margin-top:-8px">维护公共图鉴数据（写入受 RLS 保护，仅管理员可写）</div>

    <div class="admin-panel">
      <h3>用户账户（${accErr ? "未启用" : accounts.length + " 人"}）</h3>
      ${accErr
        ? '<div class="banner">用户账户表还没启用：到 Supabase → SQL Editor 跑一遍 <b>supabase/patch_06_auth.sql</b> 后刷新。</div>'
        : `<div class="sub" style="margin-top:-6px">来源 auth.users + login_logs。密码列只显示算法名——库里存的是 bcrypt 单向哈希，不可逆，本站也读不到明文。</div>
           ${accounts.length === 0 ? '<div class="card-meta">还没有注册用户</div>' : '<div class="list">' + accounts.map(a2 => `
             <div class="row-item">
               <span class="thumb" style="font-size:15px;font-weight:800">${esc((a2.email || "?").slice(0, 1).toUpperCase())}</span>
               <div class="row-main">
                 <div class="row-title">${esc(a2.email || "(无邮箱)")}${a2.is_admin ? ' <span class="badge cat">管理员</span>' : ""}</div>
                 <div class="row-sub">
                   ${esc(a2.nickname || "未命名")} · ${a2.email_confirmed ? "邮箱已验证" : "邮箱未验证"}
                   · 密码 ${esc(a2.password_algo || "?")} · 登录 ${a2.login_count || 0} 次
                   · 注册 ${esc(fmtDate(a2.signed_up_at))}
                   ${a2.last_login_at ? " · 最近 " + esc(fmtDate(a2.last_login_at)) : ""}
                 </div>
               </div>
             </div>`).join("") + "</div>"}`}
      ${accErr ? "" : `<h3 style="margin-top:18px">最近登录流水</h3>
        ${recent.length === 0
          ? '<div class="card-meta">还没有记录</div>'
          : '<div class="list">' + recent.map(r => `
              <div class="row-item">
                <div class="row-main">
                  <div class="row-title" style="font-size:13px">${esc(r.email || "")} <span class="badge edition">${esc(r.event)}</span></div>
                  <div class="row-sub">${esc(r.nickname || "")} · ${esc(fmtDate(r.created_at))}${r.user_agent ? " · " + esc(String(r.user_agent).slice(0, 60)) : ""}</div>
                </div>
              </div>`).join("") + "</div>"}`}
    </div>

    <div class="admin-panel">
      <h3>＋ 新增 IP / 系列</h3>
      <div class="form">
        <div class="field"><label class="req">系列名</label><input id="aSeriesName" placeholder="如：DIMOO"></div>
        <div class="field"><label>slug（英文，用于链接）</label><input id="aSeriesSlug" placeholder="dimoo"></div>
        <div class="field"><label>简介</label><input id="aSeriesDesc" placeholder="一句话介绍"></div>
        <button class="btn" id="aSeriesBtn">添加</button>
      </div>
    </div>

    <div class="admin-panel">
      <h3>＋ 新增藏品</h3>
      <div class="form">
        <div class="field"><label class="req">所属系列</label>
          <select id="aItemSeries">${(series || []).map(s => '<option value="' + s.id + '">' + esc(s.name) + "</option>").join("")}</select></div>
        <div class="field"><label class="req">藏品名</label><input id="aItemName" placeholder="如：DIMOO 太空旅行系列 手办"></div>
        <div class="form-row">
          <div class="field"><label>分类</label><select id="aItemCat">${CATEGORY_ORDER.map(cc => '<option value="' + cc + '">' + CATEGORY[cc] + "</option>").join("")}</select></div>
          <div class="field"><label>版本</label><select id="aItemEdition">${Object.keys(EDITION).map(e2 => '<option value="' + e2 + '">' + EDITION[e2] + "</option>").join("")}</select></div>

    <div class="admin-panel">
      <h3>＋ 标签管理</h3>
      <div class="chips">${(tags || []).map(t => '<span class="chip" title="点击删除">' + esc(t.name) + " ✕</span>").join("") || '<span class="card-meta">暂无标签</span>'}</div>

    const slug = document.getElementById("aSeriesSlug").value.trim() || ("series-" + Date.now().toString(36));
    const description = document.getElementById("aSeriesDesc").value.trim() || null;
    if (!name) return toast("请填写系列名", true);
    const { error } = await db.from("series").insert({ name, slug, description });
    if (error) return toast("添加失败：" + (error.code === "23505" ? "名称或 slug 已存在" : error.message), true);
    toast("系列已添加"); pageAdmin();
  };
  document.getElementById("aItemBtn").onclick = async () => {
    const row = {
      series_id: document.getElementById("aItemSeries").value,
      name: document.getElementById("aItemName").value.trim(),
      category: document.getElementById("aItemCat").value,
      edition: document.getElementById("aItemEdition").value,
      msrp: document.getElementById("aItemMsrp").value === "" ? null : Number(document.getElementById("aItemMsrp").value),
      release_date: document.getElementById("aItemDate").value || null,
      cover_url: document.getElementById("aItemCover").value.trim() || null,
    };
    if (!row.name || !row.series_id) return toast("请选择系列并填写藏品名", true);

    if (error) return toast("添加失败：" + (error.code === "23505" ? "同系列下已存在同名藏品" : error.message), true);
    toast("藏品已添加"); pageAdmin();
  };
  document.getElementById("aTagBtn").onclick = async () => {
    const name = document.getElementById("aTagName").value.trim();
    if (!name) return toast("请填写标签名", true);
    const { error } = await db.from("tags").insert({ name });
    if (error) return toast("添加失败：" + (error.code === "23505" ? "标签已存在" : error.message), true);
    toast("标签已添加"); pageAdmin();
  };
  $app.querySelectorAll(".chips .chip[title]").forEach(ch => ch.onclick = async () => {
    const name = ch.textContent.replace("✕", "").trim();
    if (!confirm("删除标签「" + name + "」？关联关系会一并删除")) return;
    const tag = (tags || []).find(t => t.name === name);
    if (tag) await db.from("tags").delete().eq("id", tag.id);
    pageAdmin();
  });
}

/* ---------------- 启动 ---------------- */
async function boot() {
  if (!KEY_OK) {
    $app.innerHTML = '<div class="banner">⚠️ 还没配置 anon key：打开本文件，把 SUPABASE_ANON_KEY 的值替换为你的 Supabase anon/public key，刷新即可。</div>';
    renderUserBox(); renderNav(); return;
  }
  await loadMe();
  renderUserBox();
  renderNav();
  route();
  // 点邮件里的「重置密码」链接回来时，supabase-js 会把会话塞进 URL，
  // 触发 PASSWORD_RECOVERY；这里直接弹「设置新密码」，不让用户停在原地
  if (db && db.auth && typeof db.auth.onAuthStateChange === "function") {
    db.auth.onAuthStateChange((ev) => {
      if (ev === "PASSWORD_RECOVERY") showAuthModal("newpass");
    });
  }
}
window.addEventListener("hashchange", route);
boot();
</script>
